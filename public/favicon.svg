<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="rupeeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Outer glowing accent border -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="url(#accentGrad)" stroke-width="8" opacity="0.8"/>

  <!-- Subtle grid or inner circle -->
  <circle cx="256" cy="256" r="180" fill="url(#accentGrad)" opacity="0.12" filter="url(#glow)"/>

  <!-- Rupee Symbol glyph with high clarity -->
  <g fill="url(#rupeeGrad)" transform="translate(256, 260) scale(1.1)">
    <!-- ₹ Symbol crafted with path -->
    <!-- Top bar -->
    <rect x="-90" y="-120" width="180" height="24" rx="12"/>
    <!-- Second bar -->
    <rect x="-90" y="-76" width="140" height="24" rx="12"/>
    <!-- Upper loop arc -->
    <path d="M -40 -76 C 50 -76 60 -12 0 -6 L -35 -6 L -35 -30 C -5 -30 20 -30 20 -44 C 20 -58 -10 -58 -35 -58 Z" />
    <!-- Center diagonal leg and downward slash -->
    <path d="M -20 -6 L 85 110 L 45 110 L -45 5 L -45 -6 Z"/>
    <!-- Vertical stem -->
    <rect x="-45" y="-120" width="26" height="130" rx="8"/>
  </g>

  <!-- Small upward growth indicator arrow -->
  <path d="M 370 140 L 410 140 L 410 180 M 410 140 L 350 200" fill="none" stroke="#10b981" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
</svg>